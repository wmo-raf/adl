# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - gdal-bin
    - libgdal-dev
    - libgeos-dev
    - libproj-dev
    - libpq-dev
  jobs:
    # Bring the plugin repos' docs/ into docs/plugins/ before Sphinx runs.
    # Clones each repo listed in docs/plugins_manifest.yml at its pinned ref,
    # rewrites the guides' cross-references, and generates the plugin index.
    # Runs after the python install step, so PyYAML is available.
    pre_build:
      - python3 scripts/aggregate_plugin_docs.py --source git

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: docs/requirements.txt
