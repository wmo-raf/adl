# Roster of plugin repositories whose docs are aggregated into this site.
#
# scripts/aggregate_plugin_docs.py reads this file, copies each repo's
# docs/guide.md + docs/images/ into docs/plugins/<slug>/, and generates
# docs/plugins/index.md from it. See docs-plan/README.md,
# "Aggregation conventions", for the rules a plugin guide must follow.
#
# Per entry:
#   repo         required. Clone URL. The slug (basename minus .git) is the
#                directory name under docs/plugins/ and the cross-reference key.
#   ref          git ref to clone in --source git mode. Default "main".
#                Pin to a release tag once a plugin's guide is stable.
#   docs         true  -> the repo carries docs/guide.md; it is copied and
#                        added to the toctree.
#                false -> not documented yet; listed in the index table with a
#                        link to the repository instead of to a guide.
#   name, connects_to, category, country, country_flag, choose_when
#                display metadata. For docs: true entries these come from the
#                guide's own front matter and must NOT be repeated here.
#                For docs: false entries they are the only source, so give them.

canonical_docs_url: https://adl-tool.readthedocs.io

plugins:
  # --- documented (batch 1) ------------------------------------------------
  - repo: https://github.com/wmo-raf/adl-pulsoweb-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-weatherlink-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-adcon-db-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/anam-bf/adl-ftp-adcon-bf-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-ftp-adcon-som-plugin.git
    ref: main
    docs: true

  # --- documented (batch 2) ------------------------------------------------
  # As above, these carry no display metadata here: it comes from each guide's
  # adl_plugin front matter, and a second spelling in this file would read as a
  # second plugin. (That is how the index came to call the CIMA plugin "ADL
  # CIMAWebDrops Plugin" while its guide is titled "ADL CIMA WebDrops Plugin";
  # the guide's H1 wins.)
  - repo: https://github.com/wmo-raf/adl-ftp-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-tahmo-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-cimawebdrops-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-earthnetworks-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-siapmicros-polarisweb-plugin.git
    ref: main
    docs: true

  # --- not documented yet --------------------------------------------------
  # adl-fieldclimate-plugin has a guide written and reviewed, but its capture
  # run is deferred, so it has no images yet and cannot be aggregated. Flip it
  # to docs: true (and drop the display metadata below, which then comes from
  # the guide's front matter) once that lands.
  - repo: https://github.com/wmo-raf/adl-fieldclimate-plugin.git
    ref: main
    docs: false
    name: ADL FieldClimate Plugin
    connects_to: Pessl Instruments' FieldClimate API
    category: general
    choose_when: Your stations are Pessl / METOS loggers reporting to FieldClimate.

  # --- documented (batch 3) ------------------------------------------------
  # Captured and documented; display metadata comes from each guide's own
  # adl_plugin front matter, so it must not be repeated here.
  #
  # The four batch-3 repos still on docs: false below are parked, not pending:
  # they are not in production, so their guides sit on a docs/plugin-guide
  # branch with no captures. See docs-plan/README.md, "Batch 3 status".
  - repo: https://github.com/wmo-raf/adl-s3-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-agent-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-collector-app-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-eumetsat-dcs-plugin.git
    ref: main
    docs: true

  - repo: https://github.com/wmo-raf/adl-microstep-db-plugin.git
    ref: main
    docs: false
    name: ADL MicroStep DB Plugin
    connects_to: A MicroStep-MIS AWS PostgreSQL database
    category: general
    choose_when: Your MicroStep-MIS station network stores observations in a PostgreSQL database ADL can reach directly.

  - repo: https://github.com/wmo-raf/adl-kmd-kcsap-ftp-decoder.git
    ref: main
    docs: true

  - repo: https://github.com/meteo-burundi/adl-lsi-bi-ftp-decoder.git
    ref: main
    docs: false
    name: ADL LSI BI FTP Decoder
    connects_to: FTP decoder for LSI Lastem station exports
    category: country
    country: Burundi
    country_flag: "🇧🇮"

  - repo: https://github.com/seychelles-met/adl-bouy-sc-ftp-decoder.git
    ref: main
    docs: false
    name: ADL Bouy SC FTP Decoder
    connects_to: FTP decoder for Datawell wave-buoy history files
    category: country
    country: Seychelles
    country_flag: "🇸🇨"

  - repo: https://github.com/wmo-raf/adl-vaisala-sudan-ftp-decoder.git
    ref: main
    docs: false
    name: ADL Vaisala Sudan FTP Decoder
    connects_to: FTP decoder for Vaisala AWS message logs
    category: country
    country: Sudan
    country_flag: "🇸🇩"

  - repo: https://github.com/seychelles-met/adl-vaisala-sc-ftp-decoder.git
    ref: main
    docs: true

  - repo: https://github.com/inam-mz/adl-mz-nesa-decoder.git
    ref: main
    docs: true
